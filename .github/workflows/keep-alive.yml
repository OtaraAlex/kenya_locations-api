name: Keep Alive

on:
  schedule:
    - cron: '0 12 */3 * *'  # every 3 days at noon UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
        run: curl --fail --show-error --silent "$RENDER_API_URL/health"
